# Inverse kinematics solver for the arm (KDL = numerical solver, works for any serial chain)
# arm + track (the Pilz planner needs an IK solver for every group it plans, even for joint moves)
arm_track:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
